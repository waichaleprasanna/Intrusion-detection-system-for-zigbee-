<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zigbee IDS Live Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #121218; color: #d1d1e0; font-family: 'Segoe UI', monospace; }
        .stat-card { background: #1c1c26; border-radius: 8px; padding: 18px; border-left: 4px solid #0d6efd; }
        .terminal-box { background: #0b0b10; border: 1px solid #2d2d3d; border-radius: 8px; padding: 15px; height: 420px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; }
        .terminal-header { font-size: 0.8rem; font-weight: bold; color: #8f8fa8; margin-bottom: 10px; letter-spacing: 1px; }
        .log-line { margin-bottom: 4px; border-bottom: 1px solid #1a1a24; padding-bottom: 2px; }
        .text-normal { color: #00ff66; }
        .text-alert { color: #ff3344; font-weight: bold; }
        .text-replay-copy { color: #ffd166; font-weight: bold; background: rgba(255, 209, 102, 0.07); }
        .text-replay-injected { color: #c084fc; font-weight: bold; background: rgba(192, 132, 252, 0.08); }
        .text-flood { color: #ffad42; font-weight: bold; background: rgba(255, 173, 66, 0.08); }
        .text-rogue { color: #ff5c7a; font-weight: bold; background: rgba(255, 92, 122, 0.08); }
        .alert-row { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
        .alert-kind { display: inline-block; border-radius: 4px; padding: 2px 6px; font-size: 0.72rem; letter-spacing: 0.4px; white-space: nowrap; }
        .alert-kind-rogue { color: #ff5c7a; border: 1px solid #a8324a; background: rgba(255, 92, 122, 0.12); }
        .alert-kind-flood { color: #ffad42; border: 1px solid #a96b20; background: rgba(255, 173, 66, 0.12); }
        .alert-kind-replay { color: #c084fc; border: 1px solid #7545a5; background: rgba(192, 132, 252, 0.12); }
        .alert-kind-other { color: #ff6677; border: 1px solid #873441; background: rgba(255, 102, 119, 0.1); }
        .alert-message { color: #ff6677; font-weight: 600; }
        .alert-source { color: #9d9db0; }
    </style>
</head>
<body class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h3 class="text-info m-0">🛡️ Zigbee IoT IDS — Live Airwaves Monitor</h3>
        <div class="d-flex align-items-center gap-3">
            <button type="button" class="btn btn-success" id="detection-toggle" aria-pressed="true">IDS DETECTION: ON</button>
            <span class="badge bg-secondary" id="ws-status">Connecting...</span>
        </div>
    </div>

    <div class="row g-3 mb-4 text-center">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="small text-secondary">TOTAL FRAMES CAPTURED</div>
                <h2 id="stat-packets" class="text-white mt-1">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="border-left-color: #dc3545;">
                <div class="small text-secondary">SECURITY INCIDENTS</div>
                <h2 id="stat-alerts" class="text-danger mt-1">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="border-left-color: #198754;">
                <div class="small text-secondary">WHITELISTED SENSORS</div>
                <h2 id="stat-devices" class="text-success mt-1">0</h2>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-12">
            <div class="terminal-box" style="height:auto; min-height:130px;">
                <div class="terminal-header">🌡️ ZIGBEE2MQTT SENSOR READINGS</div>
                <div id="sensorReadings" class="d-flex flex-wrap gap-2">
                    <div id="sensorPlaceholder" class="text-secondary">Waiting for temperature/humidity reports from Zigbee2MQTT MQTT…</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-7">
            <div class="terminal-box" id="trafficBox">
                <div class="terminal-header">📡 LIVE OVER-THE-AIR TRAFFIC FEED</div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="terminal-box" id="alertBox">
                <div class="terminal-header">⚠️ REAL-TIME IDS THREAT ALERTS</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let packets = 0;
        let alerts = 0;
        let detectionEnabled = true;
        const detectionToggle = document.getElementById('detection-toggle');

        function updateDetectionToggle(enabled) {
            detectionEnabled = enabled;
            detectionToggle.className = enabled ? 'btn btn-success' : 'btn btn-secondary';
            detectionToggle.setAttribute('aria-pressed', String(enabled));
            detectionToggle.innerText = enabled ? 'IDS DETECTION: ON' : 'IDS DETECTION: OFF';
            detectionToggle.title = enabled ? 'Detection is active; alerts will be generated.' : 'Detection is paused; packets remain visible without alerts.';
        }

        detectionToggle.addEventListener('click', () => {
            socket.emit('set_detection_mode', { enabled: !detectionEnabled });
        });

        function addAlertRow(data) {
            const type = data.type || data.attack_type || 'IDS ALERT';
            const lowerType = type.toLowerCase();
            let label = type.toUpperCase();
            let kindClass = 'alert-kind-other';
            if (lowerType.includes('rogue')) {
                label = 'ROGUE DEVICE';
                kindClass = 'alert-kind-rogue';
            } else if (lowerType.includes('flood') || lowerType.includes('jam')) {
                label = 'SUSTAINED PACKET FLOOD';
                kindClass = 'alert-kind-flood';
            } else if (lowerType.includes('replay')) {
                label = 'REPLAY ATTACK';
                kindClass = 'alert-kind-replay';
            }

            const row = document.createElement('div');
            row.className = 'log-line alert-row';
            const badge = document.createElement('span');
            badge.className = `alert-kind ${kindClass}`;
            badge.textContent = label;
            const message = document.createElement('span');
            message.className = 'alert-message';
            message.textContent = data.desc || data.description || '';
            row.append(badge, message);
            const source = data.src || data.source_mac;
            if (source) {
                const sourceLabel = document.createElement('span');
                sourceLabel.className = 'alert-source';
                sourceLabel.textContent = `Src: ${source}`;
                row.appendChild(sourceLabel);
            }
            document.getElementById('alertBox').appendChild(row);
        }

        function addTrafficRow(data) {
            const box = document.getElementById('trafficBox');
            const row = document.createElement('div');
            const kind = data.kind || 'normal';
            const isCopy = kind === 'replay_copy';
            const isInjected = kind === 'replay_injected';
            const isFlood = kind === 'simulated_flood' || kind === 'packet_flood';
            const isRogue = kind === 'simulated_rogue' || kind === 'rogue_device';
            row.className = `log-line ${isCopy ? 'text-replay-copy' : isInjected ? 'text-replay-injected' : isFlood ? 'text-flood' : isRogue ? 'text-rogue' : 'text-normal'}`;
            const src = data.src ?? data.source_mac ?? 'Unknown';
            const seq = data.display_seq ?? data.sequence_num ?? data.seq ?? '?';
            const wire = data.raw_sequence_num ?? data.seq;
            const wireText = wire !== undefined && wire !== null ? ` (wire: ${wire})` : '';
            const label = data.tag ? `[${data.tag}]` : '[+]';
            row.innerText = `${label} Src: ${src} | Seq: ${seq}${wireText} | RSSI: ${data.rssi ?? -50} dBm`;
            box.appendChild(row);
            box.scrollTop = box.scrollHeight;
        }

        socket.on('connect', () => {
            const el = document.getElementById('ws-status');
            el.className = 'badge bg-success';
            el.innerText = 'Connected';
        });

        socket.on('disconnect', () => {
            const el = document.getElementById('ws-status');
            el.className = 'badge bg-danger';
            el.innerText = 'Disconnected';
        });

        socket.on('detection_mode_changed', (data) => {
            updateDetectionToggle(Boolean(data.enabled));
        });

        // 1. Fetch initial baseline counts and recent logs
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                packets = data.total_packets || 0;
                alerts = data.total_alerts || 0;
                document.getElementById('stat-packets').innerText = packets;
                document.getElementById('stat-alerts').innerText = alerts;
                document.getElementById('stat-devices').innerText = data.devices || 0;

                // Load recent packets
                const tBox = document.getElementById('trafficBox');
                if (data.recent_packets) {
                    data.recent_packets.forEach(p => addTrafficRow(p));
                }

                // Load recent alerts
                const aBox = document.getElementById('alertBox');
                if (data.recent_alerts) {
                    data.recent_alerts.forEach(a => addAlertRow(a));
                    aBox.scrollTop = aBox.scrollHeight;
                }
            });

        // 2. Real-time packet event listener
        socket.on('new_packet', (data) => {
            if (!data.kind || data.kind === 'normal') {
                packets++;
                document.getElementById('stat-packets').innerText = packets;
            }
            addTrafficRow(data);
        });

        // Read-only decoded measurement feed from Zigbee2MQTT over MQTT.
        const sensorCards = new Map();
        socket.on('new_sensor_reading', (data) => {
            let card = sensorCards.get(data.friendly_name);
            if (!card) {
                card = document.createElement('div');
                card.className = 'stat-card';
                card.style.minWidth = '260px';
                card.style.padding = '12px 16px';
                document.getElementById('sensorReadings').appendChild(card);
                sensorCards.set(data.friendly_name, card);
            }
            document.getElementById('sensorPlaceholder')?.remove();
            const values = [];
            if (data.temperature !== null && data.temperature !== undefined) values.push(`Temp: ${data.temperature} °C`);
            if (data.humidity !== null && data.humidity !== undefined) values.push(`Humidity: ${data.humidity} %`);
            if (data.battery !== null && data.battery !== undefined) values.push(`Battery: ${data.battery} %`);
            if (data.voltage !== null && data.voltage !== undefined) values.push(`Voltage: ${data.voltage} mV`);
            card.textContent = `${data.friendly_name} — ${values.join(' | ')} | Updated: ${data.updated_at}`;
        });

        // 3. Real-time alert event listener
        socket.on('new_alert', (data) => {
            alerts++;
            document.getElementById('stat-alerts').innerText = alerts;
            addAlertRow(data);
            const box = document.getElementById('alertBox');
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
